services:
  # Backend Web Service
  - type: web
    name: techstax-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: ${techstax-frontend.url}
      - key: SMTP_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_TENANT_ID
        sync: false
      - key: ONEDRIVE_REFRESH_TOKEN
        sync: false
      - key: ONEDRIVE_FOLDER
        value: Resumes

  # Frontend Static Site
  - type: static
    name: techstax-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: ${techstax-backend.url}/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
